name: Build Native Desktop Installers (Tauri v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Bundled portable Node.js version'
        required: false
        default: '26.12.1'

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            node_ext: zip
            bundle: nsis
          - os: macos-14
            platform: darwin-arm64
            node_ext: tar.gz
            bundle: dmg
          - os: ubuntu-latest
            platform: linux-x64
            node_ext: tar.gz
            bundle: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Bundle portable Node runtime into ./runtime/node
        shell: bash
        env:
          NODE_VER: ${{ github.event.inputs.node_version || '26.12.1' }}
          PLAT: ${{ matrix.platform }}
          EXT: ${{ matrix.node_ext }}
        run: |
          mkdir -p runtime/node tmp_node
          URL="https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-${PLAT}.${EXT}"
          ARCHIVE="node-v${NODE_VER}-${PLAT}.${EXT}"
          curl -fSL "$URL" -o "$ARCHIVE"
          curl -fSL "https://nodejs.org/dist/v${NODE_VER}/SHASUMS256.txt" -o SHASUMS256.txt
          awk -v name="$ARCHIVE" '$2 == name { print; matched=1 } END { if (!matched) exit 1 }' SHASUMS256.txt > runtime-checksum.txt
          if command -v sha256sum >/dev/null; then sha256sum -c runtime-checksum.txt; else shasum -a 256 -c runtime-checksum.txt; fi
          if [ "$EXT" = "zip" ]; then
            unzip -q "$ARCHIVE" -d tmp_node
            cp -r tmp_node/node-v${NODE_VER}-${PLAT}/* runtime/node/
          else
            tar -xzf "$ARCHIVE" -C tmp_node --strip-components=1
            cp -r tmp_node/* runtime/node/
          fi
      - name: Check bundled Node
        shell: bash
        run: |
          NODE_BIN=runtime/node/bin/node
          if [ "${RUNNER_OS}" = Windows ]; then NODE_BIN=runtime/node/node.exe; fi
          "$NODE_BIN" --input-type=module -e 'import {assertSupportedNode} from "./tools/brain-service/runtime-config.mjs"; assertSupportedNode();'
      - name: Build native installer (Windows NSIS Setup .exe / macOS .dmg / Linux .AppImage & .deb)
        working-directory: desktop-app
        run: |
          npm install
          npm run build -- --bundles ${{ matrix.bundle }}
      - name: Verify Windows NSIS installer exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'desktop-app/src-tauri/target/release/bundle/nsis/*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw 'Tauri produced no Windows NSIS installer' }
          $installers | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Threadline-Studio-Installer-${{ matrix.platform }}
          path: desktop-app/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
