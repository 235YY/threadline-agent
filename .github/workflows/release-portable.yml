name: Build Portable Lazy-User Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Bundled portable Node.js version'
        required: false
        default: '26.12.1'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            node_ext: zip
            archive: zip
          - os: macos-14
            platform: darwin-arm64
            node_ext: tar.gz
            archive: tar.gz
          - os: macos-13
            platform: darwin-x64
            node_ext: tar.gz
            archive: tar.gz
          - os: ubuntu-latest
            platform: linux-x64
            node_ext: tar.gz
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portable bundle with Node.js runtime
        shell: bash
        env:
          NODE_VER: ${{ github.event.inputs.node_version || '26.12.1' }}
          PLAT: ${{ matrix.platform }}
          EXT: ${{ matrix.node_ext }}
        run: |
          mkdir -p dist/threadline-studio/runtime/node
          cp -r src tools scripts prompts docs config package.json README.md LICENSE THIRD_PARTY_NOTICES.md SOURCE-MANIFEST.json Start-Threadline.* dist/threadline-studio/
          touch dist/threadline-studio/portable.flag
          URL="https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-${PLAT}.${EXT}"
          ARCHIVE="node-v${NODE_VER}-${PLAT}.${EXT}"
          curl -fSL "$URL" -o "$ARCHIVE"
          curl -fSL "https://nodejs.org/dist/v${NODE_VER}/SHASUMS256.txt" -o SHASUMS256.txt
          awk -v name="$ARCHIVE" '$2 == name { print; matched=1 } END { if (!matched) exit 1 }' SHASUMS256.txt > runtime-checksum.txt
          if command -v sha256sum >/dev/null; then sha256sum -c runtime-checksum.txt; else shasum -a 256 -c runtime-checksum.txt; fi
          mkdir -p tmp_node
          if [ "$EXT" = "zip" ]; then
            unzip -q "$ARCHIVE" -d tmp_node
            cp -r tmp_node/node-v${NODE_VER}-${PLAT}/* dist/threadline-studio/runtime/node/
            NODE_BIN=dist/threadline-studio/runtime/node/node.exe
          else
            tar -xzf "$ARCHIVE" -C tmp_node --strip-components=1
            cp -r tmp_node/* dist/threadline-studio/runtime/node/
            chmod +x dist/threadline-studio/Start-Threadline.command dist/threadline-studio/Start-Threadline.sh
            NODE_BIN=dist/threadline-studio/runtime/node/bin/node
          fi
          "$NODE_BIN" --input-type=module -e 'import {assertSupportedNode} from "./tools/brain-service/runtime-config.mjs"; assertSupportedNode();'
          if [ "$EXT" = "zip" ]; then
            (cd dist && 7z a -tzip "Threadline-Studio-${PLAT}.zip" threadline-studio)
          else
            tar -czf "dist/Threadline-Studio-${PLAT}.tar.gz" -C dist threadline-studio
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Threadline-Studio-${{ matrix.platform }}
          path: dist/Threadline-Studio-*
